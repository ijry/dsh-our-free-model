name: build-windows

# 上游没有 Windows 桌面构建 CI（作者是本地编译）。
# 这个 workflow 在 GitHub 托管的 windows-latest runner 上原生执行
# prepare-desktop + tauri build，产出 NSIS 安装包并作为 artifact 上传。
on:
  workflow_dispatch:
  push:
    branches: [build/win-latest]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: packages/desktop
        run: npm install
      - name: Build NSIS installer
        working-directory: packages/desktop
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Our-Free-Model-windows-x64-setup
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
